[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackrl-environments"
version = "0.1.0"
description = "Minimal research environments with deliberately hackable reward functions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Himanshu" }
]

[project.optional-dependencies]
learning = ["torch>=2.0", "numpy>=1.23", "scikit-learn>=1.3", "matplotlib>=3.7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
